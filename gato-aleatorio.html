<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Michi Generator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0c0e12;
      --tarjeta: #151920;
      --marco: #1d222b;
      --borde: #262c36;
      --texto: #f3f4f6;
      --suave: #9aa3b2;
      --acento: #f6b93b;
      --acento-texto: #1a1300;
      --ok: #4ade80;
      --ok-fondo: rgba(74, 222, 128, 0.12);
      --aviso: #fbbf24;
      --aviso-fondo: rgba(251, 191, 36, 0.12);
      --corazon: #ff5c7a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      background: radial-gradient(ellipse at top, #1a1f29 0%, var(--bg) 60%);
      color: var(--texto);
      font-family: "Nunito", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px 40px;
      gap: 20px;
    }

    /* ---------- Tarjeta principal ---------- */
    .tarjeta {
      width: 100%;
      max-width: 460px;
      background: var(--tarjeta);
      border: 1px solid var(--borde);
      border-radius: 28px;
      padding: 22px 20px 16px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    h1 {
      margin: 0;
      font-size: clamp(1.45rem, 6vw, 1.85rem);
      font-weight: 800;
      line-height: 1.1;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .estado {
      flex-shrink: 0;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.8px;
      padding: 6px 12px;
      border-radius: 999px;
      color: var(--suave);
      background: rgba(255, 255, 255, 0.06);
      transition: color 0.3s, background 0.3s;
    }
    .estado.online { color: var(--ok); background: var(--ok-fondo); }
    .estado.offline { color: var(--aviso); background: var(--aviso-fondo); }
    .subtitulo {
      margin: 10px 0 18px;
      text-align: center;
      color: var(--suave);
      font-size: 1.02rem;
      font-weight: 600;
    }

    /* ---------- Marco de la foto ---------- */
    .marco {
      background: var(--marco);
      border-radius: 22px;
      padding: 10px 10px 12px;
    }
    .foto {
      position: relative;
      aspect-ratio: 1 / 1;
      border-radius: 16px;
      overflow: hidden;
      background: #262c36;
    }
    .foto img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      opacity: 0;
      transform: scale(1.02);
      transition: opacity 0.4s ease, transform 0.6s ease;
    }
    .foto img.visible { opacity: 1; transform: scale(1); }
    .esqueleto {
      position: absolute;
      inset: 0;
      background: linear-gradient(100deg, #262c36 30%, #303744 50%, #262c36 70%);
      background-size: 200% 100%;
      animation: brillo 1.2s linear infinite;
      opacity: 0;
      transition: opacity 0.25s;
      pointer-events: none;
    }
    .esqueleto.activo { opacity: 1; }
    @keyframes brillo { from { background-position: 150% 0; } to { background-position: -50% 0; } }
    .pie-foto {
      margin: 12px 0 0;
      text-align: center;
      color: var(--suave);
      font-weight: 600;
      min-height: 1.3em;
    }

    /* ---------- Botones ---------- */
    .principal {
      width: 100%;
      margin-top: 16px;
      padding: 18px;
      font: inherit;
      font-size: 1.3rem;
      font-weight: 800;
      background: var(--acento);
      color: var(--acento-texto);
      border: none;
      border-radius: 18px;
      cursor: pointer;
      box-shadow: 0 8px 22px rgba(246, 185, 59, 0.25);
      transition: transform 0.1s, filter 0.2s, opacity 0.2s;
    }
    .principal:hover { filter: brightness(1.06); }
    .principal:active { transform: scale(0.98); }
    .principal:disabled { opacity: 0.65; cursor: wait; }
    .secundarios {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-top: 10px;
    }
    .secundario {
      font: inherit;
      font-size: 1rem;
      font-weight: 600;
      color: var(--suave);
      background: none;
      border: none;
      padding: 10px 14px;
      border-radius: 12px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: background 0.2s, color 0.2s;
    }
    .secundario:hover:not(:disabled) { background: rgba(255, 255, 255, 0.06); color: var(--texto); }
    .secundario:disabled { opacity: 0.4; cursor: not-allowed; }
    .secundario.activo { color: var(--corazon); }
    button:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }

    /* ---------- Favoritos ---------- */
    .favoritos {
      width: 100%;
      max-width: 460px;
    }
    .favoritos summary {
      cursor: pointer;
      color: var(--suave);
      font-weight: 700;
      padding: 8px 4px;
      list-style: none;
    }
    .favoritos summary::-webkit-details-marker { display: none; }
    .favoritos summary::before { content: "▸ "; }
    .favoritos[open] summary::before { content: "▾ "; }
    .grilla {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(88px, 1fr));
      gap: 8px;
      margin-top: 8px;
    }
    .grilla button {
      padding: 0;
      border: 2px solid transparent;
      border-radius: 12px;
      overflow: hidden;
      aspect-ratio: 1 / 1;
      background: var(--marco);
      cursor: pointer;
    }
    .grilla button:hover { border-color: var(--acento); }
    .grilla img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .vacio { color: var(--suave); font-size: 0.95rem; margin: 6px 4px; }

    .ayuda {
      color: #6b7280;
      font-size: 0.85rem;
      text-align: center;
      margin: 0;
    }
    kbd {
      background: #1f242d;
      border: 1px solid #2f3642;
      border-radius: 5px;
      padding: 1px 6px;
      font-size: 0.8rem;
      font-family: inherit;
    }

    /* ---------- Aviso flotante ---------- */
    .toast {
      position: fixed;
      left: 50%;
      bottom: 24px;
      transform: translate(-50%, 20px);
      background: #f3f4f6;
      color: #111;
      font-weight: 700;
      padding: 10px 18px;
      border-radius: 999px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s, transform 0.25s;
      max-width: 90vw;
      text-align: center;
    }
    .toast.visible { opacity: 1; transform: translate(-50%, 0); }

    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; animation: none !important; }
    }
  </style>
</head>
<body>
  <main class="tarjeta">
    <header>
      <h1><span aria-hidden="true">🐈</span> Michi Generator</h1>
      <span id="estado" class="estado" role="status">…</span>
    </header>
    <p class="subtitulo">Tu dosis diaria de michis.</p>

    <div class="marco">
      <div class="foto">
        <img id="foto-gato" alt="">
        <div id="esqueleto" class="esqueleto activo" aria-hidden="true"></div>
      </div>
      <p id="pie" class="pie-foto" aria-live="polite">Buscando un michi…</p>
    </div>

    <button id="boton" class="principal">Ver otro gato 🐱</button>

    <div class="secundarios">
      <button id="btn-fav" class="secundario" aria-pressed="false" disabled>
        <span id="icono-fav" aria-hidden="true">♡</span> Favoritos
      </button>
      <button id="btn-compartir" class="secundario" disabled>
        <span aria-hidden="true">↗</span> Compartir
      </button>
    </div>
  </main>

  <details class="favoritos" id="panel-fav">
    <summary>Mis favoritos (<span id="cant-fav">0</span>)</summary>
    <div id="grilla" class="grilla"></div>
    <p id="vacio" class="vacio">Tocá ♡ Favoritos en un michi para guardarlo acá.</p>
  </details>

  <p class="ayuda">Michis vistos: <strong id="contador">0</strong> · Atajo: <kbd>Espacio</kbd></p>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script>
    const $ = id => document.getElementById(id);
    const img = $("foto-gato"), boton = $("boton"), pie = $("pie"), estado = $("estado");
    const esqueleto = $("esqueleto"), contador = $("contador");
    const btnFav = $("btn-fav"), iconoFav = $("icono-fav"), btnCompartir = $("btn-compartir");
    const grilla = $("grilla"), cantFav = $("cant-fav"), vacio = $("vacio");

    let actual = null;     // { url, dibujado }
    let vistos = 0;
    let ocupado = false;

    /* ---------- Fuentes de gatos ---------- */
    function precargar(url, ms = 8000) {
      return new Promise((resolve, reject) => {
        const prueba = new Image();
        const reloj = setTimeout(() => reject(new Error("tiempo agotado")), ms);
        prueba.onload = () => { clearTimeout(reloj); resolve(url); };
        prueba.onerror = () => { clearTimeout(reloj); reject(new Error("no cargó")); };
        prueba.src = url;
      });
    }

    // 1) cataas.com, la misma fuente del script de Python
    function desdeCataas() {
      return precargar("https://cataas.com/cat?width=800&t=" + Date.now());
    }

    // 2) TheCatAPI (el endpoint correcto es api.thecatapi.com/v1/images/search)
    async function desdeTheCatAPI() {
      const ctrl = new AbortController();
      const reloj = setTimeout(() => ctrl.abort(), 8000);
      try {
        const res = await fetch("https://api.thecatapi.com/v1/images/search", { signal: ctrl.signal });
        if (!res.ok) throw new Error("HTTP " + res.status);
        const data = await res.json();
        return precargar(data[0].url);
      } finally {
        clearTimeout(reloj);
      }
    }

    // 3) Sin internet: un michi dibujado al azar
    const azar = arr => arr[Math.floor(Math.random() * arr.length)];
    function gatoDibujado() {
      const pelajes = ["#f4a261", "#e9c46a", "#9c6644", "#6c757d", "#d9d9d9", "#2b2b2b", "#c97b3d", "#f1e3d3"];
      const ojos = ["#7cb518", "#ffb703", "#4cc9f0", "#90be6d", "#e9a03b"];
      const fondos = ["#264653", "#3d405b", "#2a9d8f", "#6d597a", "#355070", "#344e41"];
      const pelo = azar(pelajes);
      const mancha = azar(pelajes.filter(c => c !== pelo));
      const ojo = azar(ojos);
      const fondo = azar(fondos);
      const patron = azar(["liso", "rayas", "mancha"]);
      const oscuro = ["#2b2b2b", "#6c757d", "#9c6644"].includes(pelo);
      const linea = oscuro ? "#f2f2f2" : "#2b2b2b";
      const lado = Math.random() < 0.5 ? 1 : -1;

      let dibujo = "";
      if (patron === "rayas") {
        const r = oscuro ? "#111" : "rgba(0,0,0,0.25)";
        dibujo = `
          <path d="M200 125 L200 175" stroke="${r}" stroke-width="12" stroke-linecap="round"/>
          <path d="M168 133 L176 175" stroke="${r}" stroke-width="10" stroke-linecap="round"/>
          <path d="M232 133 L224 175" stroke="${r}" stroke-width="10" stroke-linecap="round"/>
          <path d="M72 235 L110 241 M74 265 L112 263" stroke="${r}" stroke-width="9" stroke-linecap="round"/>
          <path d="M328 235 L290 241 M326 265 L288 263" stroke="${r}" stroke-width="9" stroke-linecap="round"/>`;
      } else if (patron === "mancha") {
        dibujo = `<ellipse cx="${200 - 70 * lado}" cy="185" rx="85" ry="75" fill="${mancha}"/>`;
      }

      const L = 150, R = 250;
      const svg = `
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <rect width="400" height="400" fill="${fondo}"/>
  <ellipse cx="200" cy="378" rx="120" ry="14" fill="rgba(0,0,0,0.18)"/>
  <defs>
    <clipPath id="c">
      <ellipse cx="200" cy="245" rx="130" ry="112"/>
      <polygon points="85,185 105,70 185,145"/>
      <polygon points="315,185 295,70 215,145"/>
    </clipPath>
  </defs>
  <g clip-path="url(#c)">
    <rect width="400" height="400" fill="${pelo}"/>
    ${dibujo}
  </g>
  <polygon points="108,160 116,97 160,143" fill="#f6a5b8"/>
  <polygon points="292,160 284,97 240,143" fill="#f6a5b8"/>
  <ellipse cx="${L}" cy="230" rx="26" ry="30" fill="${ojo}" stroke="${linea}" stroke-width="3"/>
  <ellipse cx="${R}" cy="230" rx="26" ry="30" fill="${ojo}" stroke="${linea}" stroke-width="3"/>
  <ellipse cx="${L}" cy="232" rx="8" ry="22" fill="#111"/>
  <ellipse cx="${R}" cy="232" rx="8" ry="22" fill="#111"/>
  <circle cx="${L + 8}" cy="219" r="5" fill="#fff"/>
  <circle cx="${R + 8}" cy="219" r="5" fill="#fff"/>
  <polygon points="188,277 212,277 200,290" fill="#f28ba8"/>
  <path d="M200 290 q -12 18 -28 8 M200 290 q 12 18 28 8" fill="none" stroke="${linea}" stroke-width="3" stroke-linecap="round"/>
  <g stroke="${linea}" stroke-width="2.5" stroke-linecap="round" opacity="0.85">
    <path d="M150 280 L60 265 M150 290 L58 293 M152 300 L68 320"/>
    <path d="M250 280 L340 265 M250 290 L342 293 M248 300 L332 320"/>
  </g>
</svg>`;
      return "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
    }

    /* ---------- Favoritos (guardados en este navegador) ---------- */
    const CLAVE = "michi-generator-favoritos";
    function leerFavs() {
      try { return JSON.parse(localStorage.getItem(CLAVE)) || []; } catch { return []; }
    }
    function guardarFavs(lista) {
      try { localStorage.setItem(CLAVE, JSON.stringify(lista)); } catch { /* sin almacenamiento */ }
    }
    let favoritos = leerFavs();

    function esFavorito(url) { return favoritos.some(f => f.url === url); }

    function pintarFavs() {
      cantFav.textContent = favoritos.length;
      vacio.hidden = favoritos.length > 0;
      grilla.innerHTML = "";
      favoritos.forEach(f => {
        const b = document.createElement("button");
        b.title = "Ver este michi";
        const mini = document.createElement("img");
        mini.src = f.url;
        mini.alt = f.dibujado ? "Michi dibujado guardado" : "Foto de michi guardada";
        mini.loading = "lazy";
        b.appendChild(mini);
        b.addEventListener("click", () => {
          mostrar(f.url, f.dibujado);
          window.scrollTo({ top: 0, behavior: "smooth" });
        });
        grilla.appendChild(b);
      });
      if (actual) {
        const fav = esFavorito(actual.url);
        btnFav.classList.toggle("activo", fav);
        btnFav.setAttribute("aria-pressed", fav);
        iconoFav.textContent = fav ? "♥" : "♡";
      }
    }

    btnFav.addEventListener("click", () => {
      if (!actual) return;
      if (esFavorito(actual.url)) {
        favoritos = favoritos.filter(f => f.url !== actual.url);
        avisar("Quitado de favoritos");
      } else {
        favoritos.unshift({ url: actual.url, dibujado: actual.dibujado });
        favoritos = favoritos.slice(0, 30);
        avisar("Guardado en favoritos ♥");
      }
      guardarFavs(favoritos);
      pintarFavs();
    });

    /* ---------- Compartir ---------- */
    btnCompartir.addEventListener("click", async () => {
      if (!actual || actual.dibujado) return;
      try {
        if (navigator.share) {
          await navigator.share({ title: "Michi Generator", text: "Mirá este michi 🐱", url: actual.url });
          return;
        }
      } catch (e) {
        if (e.name === "AbortError") return; // la persona canceló
      }
      try {
        await navigator.clipboard.writeText(actual.url);
        avisar("Link copiado 📋");
      } catch {
        avisar("No se pudo copiar el link");
      }
    });

    /* ---------- Interfaz ---------- */
    let relojToast;
    function avisar(texto) {
      const t = $("toast");
      t.textContent = texto;
      t.classList.add("visible");
      clearTimeout(relojToast);
      relojToast = setTimeout(() => t.classList.remove("visible"), 1800);
    }

    function ponerEstado(online) {
      estado.textContent = online ? "ONLINE" : "OFFLINE";
      estado.className = "estado " + (online ? "online" : "offline");
      estado.title = online ? "Mostrando fotos reales" : "Sin acceso a internet: mostrando michis dibujados";
    }

    function mostrar(url, dibujado) {
      actual = { url, dibujado };
      img.classList.remove("visible");
      requestAnimationFrame(() => {
        img.src = url;
        img.alt = dibujado ? "Dibujo de un michi al azar" : "Foto de un michi al azar";
        requestAnimationFrame(() => img.classList.add("visible"));
      });
      pie.textContent = dibujado
        ? "Michi dibujado (sin conexión) ✏️"
        : "Un michi aleatorio para vos ❤️";
      btnFav.disabled = false;
      btnCompartir.disabled = dibujado;
      btnCompartir.title = dibujado ? "Solo se pueden compartir fotos reales" : "";
      pintarFavs();
    }

    async function cargarGato() {
      if (ocupado) return;
      ocupado = true;
      boton.disabled = true;
      esqueleto.classList.add("activo");
      pie.textContent = "Buscando un michi…";

      let url = null;
      try {
        try { url = await desdeCataas(); }
        catch { url = await desdeTheCatAPI(); }
      } catch { url = null; }

      if (url) {
        ponerEstado(true);
        mostrar(url, false);
      } else {
        ponerEstado(false);
        mostrar(gatoDibujado(), true);
      }
      vistos++;
      contador.textContent = vistos;
      esqueleto.classList.remove("activo");
      boton.disabled = false;
      ocupado = false;
    }

    boton.addEventListener("click", cargarGato);
    document.addEventListener("keydown", e => {
      const enBoton = document.activeElement && document.activeElement.tagName === "BUTTON";
      if (e.code === "Space" && !enBoton) {
        e.preventDefault();
        cargarGato();
      }
    });

    pintarFavs();
    cargarGato();
  </script>
</body>
</html>
